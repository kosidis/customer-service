# Production: autoscaled from 3 replicas, spread across zones and nodes,
# protected by a PodDisruptionBudget.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpread:
  enabled: true

# Public entry point. The API itself isn't exposed.
ingress:
  enabled: true
  # Placeholder: set to your cluster's ingress class.
  className: nginx
  hosts:
    - host: customer-service.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: customer-service-tls
      hosts:
        - customer-service.example.com
