# Development: one small replica, no ingress (use kubectl port-forward).
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Dev is reached over plain http (port-forward), so a Secure cookie would not be sent.
sessionCookieSecure: "false"

ingress:
  enabled: false
