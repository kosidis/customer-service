# TLS front for the API, used by the Compose "mobile" profile.
# Request bodies and Authorization headers are never logged: the access log
# format below carries only address, method, path, status and size.
log_format minimal '$remote_addr "$request_method $uri" $status $body_bytes_sent';

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log minimal;

    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
