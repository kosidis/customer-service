# Staging: two replicas, production-like settings.
replicaCount: 2

aspnetcoreEnvironment: Staging

database:
  existingSecret: customer-service-db

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

# The Android app calls the API directly, so only /api is exposed (health
# endpoints stay internal). The host is a placeholder: override it per cluster
# with --set or a private values file. Create the TLS secret first. The web
# app still reaches the API over its ClusterIP Service.
ingress:
  enabled: true
  hosts:
    - host: customer-api.staging.example
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: customer-service-api-tls
      hosts:
        - customer-api.staging.example
