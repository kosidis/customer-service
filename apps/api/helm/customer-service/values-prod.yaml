# Production: autoscaled from 3 replicas, spread across zones and nodes,
# protected by a PodDisruptionBudget.
aspnetcoreEnvironment: Production

database:
  existingSecret: customer-service-db

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpread:
  enabled: true

# Only the web app (apps/web) calls the API, over its ClusterIP Service, so the
# API isn't exposed. The web chart's ingress takes the public host.
ingress:
  enabled: false
