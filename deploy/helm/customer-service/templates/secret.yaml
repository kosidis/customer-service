{{- if .Values.database.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "customer-service.databaseSecretName" . }}
  labels:
    {{- include "customer-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.connectionString | quote }}
{{- end }}
