# Staging: two replicas behind an ingress, production-like settings.
replicaCount: 2

aspnetcoreEnvironment: Staging

database:
  existingSecret: customer-service-db

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

ingress:
  enabled: true
  # Placeholders: set your ingress class, host and TLS secret.
  className: nginx
  hosts:
    - host: customer-service.staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: customer-service-staging-tls
      hosts:
        - customer-service.staging.example.com
