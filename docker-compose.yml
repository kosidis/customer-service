services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server has no arm64 image; Apple Silicon runs it under Rosetta.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./apps/api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__CustomerDb: "Server=sqlserver,1433;Database=CustomerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd};TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "8080:8080"

  web:
    build: ./apps/web
    depends_on:
      - api
    environment:
      # Server-side only: the browser talks to the web app, which calls the API.
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"

volumes:
  sqlserver-data:
